<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afinador Cromático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tuner-container">
        <h1>Afinador Cromático</h1>
        
        <!-- Mostrador principal da Nota -->
        <div class="note-display" id="note-display">--</div>
        
        <!-- Frequência exata em Hertz -->
        <div class="frequency-display" id="frequency-display">0.0 Hz</div>

        <!-- Barra visual do ponteiro de afinação -->
        <div class="gauge">
            <div class="gauge-center-line"></div>
            <div class="needle" id="needle"></div>
        </div>

        <!-- Indicador de estado (Abaixo / Afinado / Acima) -->
        <div class="status-text" id="status-text">Pressione Iniciar</div>

        <!-- Botão para ligar o microfone -->
        <button id="start-btn">Ligar Microfone 🎤</button>
    </div>

    <script src="tuner.js"></script>
</body>
</html>
