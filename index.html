<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/music-diapason_98214.ico" type="image/x-icon">
    <title>Afinador Cromático</title>

    <!--Music diapason Icon by Dario Ferrando on <a href="https://icon-icons.com/authors/170-dario-ferrando">Icon-Icons.com</a>-->

    <!-- 1. VÍNCULO COM O MANIFEST (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tuner-container">
        <h1>Afinador Cromático</h1>
        
        <div class="note-display" id="note-display">--</div>
        <div class="frequency-display" id="frequency-display">0.0 Hz</div>

        <div class="gauge">
            <div class="gauge-center-line"></div>
            <div class="needle" id="needle"></div>
        </div>

        <div class="status-text" id="status-text">Pressione Iniciar</div>

        <button id="start-btn">Ligar Microfone 🎤</button>
    </div>

    <script src="tuner.js"></script>

    <!-- 2. REGISTO DO SERVICE WORKER (Para funcionar offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registado com sucesso!'))
                    .catch(err => console.error('Erro ao registar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
